plugins {
    // This alias is from your libs.versions.toml file and is correct.
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'my.edu.utar.grandarchivecompanion'
    compileSdk 34

    defaultConfig {
        applicationId "my.edu.utar.grandarchivecompanion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Sticking with Java 8 is fine, but you could upgrade to 11 or 17 in the future.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    // --- From Version Catalog (libs.versions.toml) ---
    implementation libs.appcompat
    implementation libs.material // This should be the ONLY material dependency
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment // Keep the version catalog alias
    implementation libs.navigation.ui
    implementation libs.androidx.navigation.fragment// Keep the version catalog alias

    // --- Core & Lifecycle Dependencies ---
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.preference:preference:1.2.1'
    // Note: core-ktx is often brought in by other libs like activity, but explicitly adding is fine.
    implementation 'androidx.core:core-ktx:1.13.1'

    // --- Networking and Utility Dependencies ---
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // --- Markwon Dependencies (Corrected and De-duplicated) ---
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation "io.noties.markwon:image-glide:4.6.2"

    // --- Testing Dependencies ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core


}