plugins {
    // This alias is from your libs.versions.toml file and is correct.
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'my.edu.utar.grandarchivecompanion'
    compileSdk 34

    defaultConfig {
        applicationId "my.edu.utar.grandarchivecompanion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Sticking with Java 8 is fine, but you could upgrade to 11 or 17 in the future.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // --- Use Version Catalog Aliases (the libs.* method) ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // --- Core & Lifecycle Dependencies ---
    // You have these defined as hardcoded strings, which is fine if they aren't in your TOML file.
    implementation 'androidx.core:core-ktx:1.13.1'
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    // --- Networking and Utility Dependencies ---
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'io.noties.markwon:core:4.6.2'

    // --- Testing Dependencies ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- REMOVED DUPLICATE AND CONFLICTING LINES ---
    // implementation 'androidx.appcompat:appcompat:1.7.0' // Removed: Duplicate of libs.appcompat
    // implementation 'com.google.android.material:material:1.12.0' // Removed: Duplicate
    // implementation 'com.google.android.material:material:1.13.0' // Removed: Conflict with libs.material
    // implementation 'androidx.constraintlayout:constraintlayout:2.2.0' // Removed: Duplicate of libs.constraintlayout
    // implementation 'com.github.chrisbane:PhotoView:library:2.3.0' // Removed: Typo and duplicate of libs.photoview
}